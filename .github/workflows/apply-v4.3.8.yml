name: Apply v4.3.8 factory reset
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="core/factory-reset.js"></script>'
          if tag not in s:
              s=s.replace('</body>', f'    {tag}\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          p=Path('core/app-state.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('    usuarios: [')
          end=s.index('    ],\n    usuarioActual:', start)+6
          one="""    usuarios: [
        {
            id: 'SuperAdmin',
            cedula: 'SuperAdmin',
            nombre: 'SuperAdmin',
            telefono: '0412-0000000',
            email: 'superadmin@tubodeguita.com',
            password: '1a09807a0e6928a66d91025ed5fccd713c9edb101e72a1bbcb8a01cd9a53cb51',
            rol: 'admin',
            estado: 'ACTIVO',
            puntosAcumulados: 0,
            puntosCanjeados: 0,
            fechaRegistro: '2026-08-30 00:00'
        }
    ]"""
          s=s[:start]+one+s[end:]
          p.write_text(s, encoding='utf-8')
          Path('VERSION.txt').write_text('4.3.8-beta\n',encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html core/app-state.js core/factory-reset.js VERSION.txt
          git commit -m 'feat: add SuperAdmin factory reset button v4.3.8-beta' || exit 0
          git push
      - name: Remove bootstrap workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-v4.3.8.yml
          git add .github/workflows/apply-v4.3.8.yml
          git commit -m 'chore: remove v4.3.8 bootstrap workflow' || true
          git push || true
