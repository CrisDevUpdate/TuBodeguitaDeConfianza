name: Apply v4.3.6 changes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply client approval and email changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return False
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              return True

          usuarios_old = '''    // Asegurar en lista de clientes si es cliente
    if (usuario.rol === 'cliente' && Array.isArray(AppState.clientes) && !AppState.clientes.find(c => c.id === cedula)) {
        AppState.clientes.push({
            id: cedula,
            nombre: usuario.nombre,
            telefono: usuario.telefono || ''
        });
    }

    // Persistir
    if (window.InventoryApp.Persistence) window.InventoryApp.Persistence.guardar(true);
    if (window.InventoryApp.Firebase && typeof window.InventoryApp.Firebase.guardarUsuario === 'function') {
        window.InventoryApp.Firebase.guardarUsuario(usuario);
    }

    renderizarUsuarios();
    actualizarBadgesUsuarios();
    verificarGatewall();'''

          usuarios_new = '''    // Un cliente aprobado entra automáticamente al Directorio de Clientes.
    // Se crea o actualiza su ficha local y también se sincroniza con Firestore.
    if (usuario.rol === 'cliente') {
        if (!Array.isArray(AppState.clientes)) AppState.clientes = [];

        let clienteExistente = AppState.clientes.find(c => c.id === cedula);
        const datosCliente = {
            id: cedula,
            nombre: usuario.nombre || '',
            telefono: usuario.telefono || '',
            email: (usuario.email || '').trim().toLowerCase()
        };

        if (clienteExistente) {
            Object.assign(clienteExistente, datosCliente);
        } else {
            clienteExistente = datosCliente;
            AppState.clientes.push(clienteExistente);
        }

        if (window.InventoryApp.Firebase && typeof window.InventoryApp.Firebase.guardarCliente === 'function') {
            window.InventoryApp.Firebase.guardarCliente(clienteExistente).catch(err => {
                console.error('[Usuarios] No se pudo sincronizar el cliente aprobado:', err);
            });
        }
    }

    // Persistir usuario y estado local.
    if (window.InventoryApp.Persistence) window.InventoryApp.Persistence.guardar(true);
    if (window.InventoryApp.Firebase && typeof window.InventoryApp.Firebase.guardarUsuario === 'function') {
        window.InventoryApp.Firebase.guardarUsuario(usuario);
    }

    renderizarUsuarios();
    actualizarBadgesUsuarios();
    if (typeof actualizarSelectClientes === 'function') actualizarSelectClientes();
    if (typeof actualizarSelectTransacciones === 'function') actualizarSelectTransacciones();
    if (typeof renderizarClientes === 'function') renderizarClientes();
    verificarGatewall();'''

          replace_once('modules/usuarios.js', usuarios_old, usuarios_new)

          clientes_old = '''    const nuevoCliente = {
        id: document.getElementById('cli-id').value.trim(),
        nombre: document.getElementById('cli-nombre').value.trim(),
        telefono: document.getElementById('cli-telefono').value.trim()
    };'''
          clientes_new = '''    const nuevoCliente = {
        id: document.getElementById('cli-id').value.trim(),
        nombre: document.getElementById('cli-nombre').value.trim(),
        telefono: document.getElementById('cli-telefono').value.trim(),
        email: (document.getElementById('cli-email')?.value || '').trim().toLowerCase()
    };'''
          replace_once('modules/clientes.js', clientes_old, clientes_new)

          clientes_render_old = '''                <td>${c.id}</td>
                <td>${c.nombre}</td>
                <td>${c.telefono}</td>
                <td class="num">$${totalCompradoUSD.toFixed(2)}</td>'''
          clientes_render_new = '''                <td>${c.id}</td>
                <td>${c.nombre}</td>
                <td>${c.telefono}</td>
                <td>${c.email || '—'}</td>
                <td class="num">$${totalCompradoUSD.toFixed(2)}</td>'''
          replace_once('modules/clientes.js', clientes_render_old, clientes_render_new)

          index_form_old = '''                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" id="cli-telefono" required>
                </div>
                <button type="submit" class="btn btn-success">Crear Cliente</button>'''
          index_form_new = '''                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" id="cli-telefono" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico <span style="color:var(--text-muted);">(opcional)</span></label>
                    <input type="email" id="cli-email" placeholder="cliente@correo.com" autocomplete="email">
                </div>
                <button type="submit" class="btn btn-success">Crear Cliente</button>'''
          replace_once('index.html', index_form_old, index_form_new)

          index_table_old = '''                            <th>Teléfono</th>
                            <th class="num">Total Comprado ($)</th>'''
          index_table_new = '''                            <th>Teléfono</th>
                            <th>Correo Electrónico</th>
                            <th class="num">Total Comprado ($)</th>'''
          replace_once('index.html', index_table_old, index_table_new)

          version = Path('VERSION.txt')
          version.write_text('4.3.6-beta\n', encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text(encoding='utf-8') if changelog.exists() else '# Changelog\n'
          release = '''## 4.3.6-beta
- Al aprobar un usuario con rol cliente, se crea o actualiza automáticamente su ficha en el Directorio de Clientes.
- La ficha aprobada conserva nombre, teléfono y correo electrónico y se sincroniza con Firestore.
- El formulario administrativo de creación manual de clientes permite registrar un correo electrónico opcional.
- El directorio muestra el correo electrónico del cliente.
- Los selectores de clientes y transacciones se refrescan inmediatamente después de la aprobación.

'''
          if '## 4.3.6-beta' not in current:
              if current.startswith('# Changelog'):
                  current = '# Changelog\n\n' + release + current[len('# Changelog'):].lstrip('\n')
              else:
                  current = release + current
              changelog.write_text(current, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/usuarios.js modules/clientes.js index.html VERSION.txt CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: promote approved clients and capture email (v4.3.6-beta)"
          git push

      - name: Remove bootstrap workflow
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main || true
          if [ -f .github/workflows/apply-v4.3.6.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            rm .github/workflows/apply-v4.3.6.yml
            git add .github/workflows/apply-v4.3.6.yml
            git commit -m "chore: remove v4.3.6 bootstrap workflow" || true
            git push || true
          fi
