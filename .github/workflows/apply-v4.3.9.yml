name: Apply v4.3.9 dataset workspaces

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Firebase dataset namespace
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('core/firebase-service.js')
          text = p.read_text(encoding='utf-8')

          old = '''    // Colecciones de Firestore\n    const COLLECTIONS = {\n        PRODUCTOS: 'productos',\n        CLIENTES: 'clientes',\n        VENTAS: 'ventas',\n        ABONOS: 'abonos',\n        TRANSACCIONES: 'transacciones',\n        AUDITORIAS: 'auditorias',\n        ELIMINACIONES: 'eliminaciones',\n        CLIENTES_ELIMINADOS: 'clientesEliminados',\n        USUARIOS: 'usuarios',\n        CONFIG: 'config'\n    };'''

          new = '''    // Colecciones de Firestore. Los datos históricos nunca se borran:\n    // después de un reinicio se cambia el namespace activo y las nuevas operaciones\n    // se escriben en colecciones nuevas. El namespace legacy conserva los datos previos.\n    const BASE_COLLECTIONS = {\n        PRODUCTOS: 'productos',\n        CLIENTES: 'clientes',\n        VENTAS: 'ventas',\n        ABONOS: 'abonos',\n        TRANSACCIONES: 'transacciones',\n        AUDITORIAS: 'auditorias',\n        ELIMINACIONES: 'eliminaciones',\n        CLIENTES_ELIMINADOS: 'clientesEliminados',\n        USUARIOS: 'usuarios',\n        CONFIG: 'config'\n    };\n\n    function getActiveDatasetId() {\n        try { return localStorage.getItem('bodeguita_active_dataset') || 'legacy'; }\n        catch (_) { return 'legacy'; }\n    }\n\n    const COLLECTIONS = new Proxy(BASE_COLLECTIONS, {\n        get(target, prop) {\n            const base = target[prop];\n            if (!base) return undefined;\n            if (prop === 'CONFIG') return base;\n            const dataset = getActiveDatasetId();\n            return dataset === 'legacy' ? base : `${dataset}__${base}`;\n        }\n    });'''

          if old not in text:
              raise SystemExit('No se encontró el bloque COLLECTIONS esperado.')
          text = text.replace(old, new, 1)

          old_export = '''        actualizarUIEstadoNube,\n        getConfig: obtenerConfiguracion\n    };'''
          new_export = '''        actualizarUIEstadoNube,\n        getConfig: obtenerConfiguracion,\n        getFirestore: () => db,\n        getActiveDatasetId,\n        getCollectionName: (key) => COLLECTIONS[key]\n    };'''
          if old_export not in text:
              raise SystemExit('No se encontró el bloque de exportación esperado.')
          text = text.replace(old_export, new_export, 1)

          p.write_text(text, encoding='utf-8')

          # Ensure the new dataset manager is loaded before the closing body tag.
          h = Path('index.html')
          html = h.read_text(encoding='utf-8')
          script = '    <script src="core/dataset-manager.js"></script>\n'
          if 'core/dataset-manager.js' not in html:
              marker = '</body>'
              if marker not in html:
                  raise SystemExit('No se encontró </body> en index.html')
              html = html.replace(marker, script + marker, 1)
              h.write_text(html, encoding='utf-8')

          # Version marker and changelog.
          Path('VERSION.txt').write_text('4.3.9-beta\n', encoding='utf-8')
          c = Path('CHANGELOG.md')
          current = c.read_text(encoding='utf-8') if c.exists() else '# Changelog\n'
          if '## 4.3.9-beta' not in current:
              entry = '''## 4.3.9-beta\n- Reinicio por espacios de trabajo: los datos anteriores se conservan intactos y se archivan como JSON por registro.\n- Cada reinicio crea un namespace nuevo de Firestore para empezar con una base operativa limpia.\n- Se crea automáticamente el único usuario inicial SuperAdmin en el nuevo espacio.\n- El acceso al reinicio está en Configuraciones y exige la contraseña especial de confirmación.\n- Se genera además un respaldo JSON descargable en cada reinicio.\n\n'''
              if current.startswith('# Changelog'):
                  current = '# Changelog\n\n' + entry + current[len('# Changelog'):].lstrip('\n')
              else:
                  current = entry + current
              c.write_text(current, encoding='utf-8')
          PY

      - name: Commit applied patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/firebase-service.js index.html VERSION.txt CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add versioned data workspaces (v4.3.9-beta)"
          git push

      - name: Remove bootstrap workflow
        if: always()
        shell: bash
        run: |
          git pull --ff-only origin main || true
          if [ -f .github/workflows/apply-v4.3.9.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            rm .github/workflows/apply-v4.3.9.yml
            git add .github/workflows/apply-v4.3.9.yml
            git commit -m "chore: remove v4.3.9 bootstrap workflow" || true
            git push || true
          fi
