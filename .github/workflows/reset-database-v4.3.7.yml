name: Reset database to clean SuperAdmin baseline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reset-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch clean baseline and one-time Firestore reset
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return False
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              return True

          app_old = '''    usuarios: [
        {
            id: 'SuperAdmin',
            cedula: 'SuperAdmin',
            nombre: 'SuperAdmin',
            telefono: '0412-0000000',
            email: 'superadmin@tubodeguita.com',
            // Hash SHA-256 criptográfico (irreversible)
            password: '1a09807a0e6928a66d91025ed5fccd713c9edb101e72a1bbcb8a01cd9a53cb51',
            rol: 'admin',
            estado: 'ACTIVO',
            puntosAcumulados: 0,
            puntosCanjeados: 0,
            fechaRegistro: '2026-08-28 12:00'
        },
        {
            id: 'V-00000001',
            cedula: 'V-00000001',
            nombre: 'Administrador Principal',
            telefono: '0412-0000000',
            email: 'admin@tubodeguita.com',
            // Hash SHA-256 de la contraseña
            password: '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918',
            rol: 'admin',
            estado: 'ACTIVO',
            puntosAcumulados: 0,
            puntosCanjeados: 0,
            fechaRegistro: '2026-08-28 12:00'
        }
    ],'''

          app_new = '''    // BASE LIMPIA: únicamente SuperAdmin al iniciar un sistema nuevo.
    usuarios: [
        {
            id: 'SuperAdmin',
            cedula: 'SuperAdmin',
            nombre: 'SuperAdmin',
            telefono: '0412-0000000',
            email: 'superadmin@tubodeguita.com',
            // Hash SHA-256 criptográfico (irreversible)
            password: '1a09807a0e6928a66d91025ed5fccd713c9edb101e72a1bbcb8a01cd9a53cb51',
            rol: 'admin',
            estado: 'ACTIVO',
            puntosAcumulados: 0,
            puntosCanjeados: 0,
            fechaRegistro: '2026-08-28 12:00'
        }
    ],'''
          replace_once('core/app-state.js', app_old, app_new)

          fb = Path('core/firebase-service.js')
          text = fb.read_text(encoding='utf-8')

          marker = '''    const COLLECTIONS = {
'''
          if 'async function ejecutarReinicioInicialV4_3_7()' not in text:
              insert = r'''

    /**
     * Reinicio inicial único de la base de datos para comenzar desde cero.
     * Borra los datos operativos conocidos y conserva/recrea únicamente SuperAdmin.
     * Se ejecuta una sola vez mediante un marcador en Firestore.
     */
    async function ejecutarReinicioInicialV4_3_7() {
        if (!db) return false;

        const markerRef = db.collection(COLLECTIONS.CONFIG).doc('_system_reset_v4_3_7');
        try {
            const markerSnap = await markerRef.get({ source: 'server' }).catch(() => markerRef.get());
            if (markerSnap.exists) return false;
        } catch (e) {
            console.warn('[Firebase] No se pudo consultar marcador de reinicio:', e);
            return false;
        }

        const collectionsToClear = [
            COLLECTIONS.PRODUCTOS,
            COLLECTIONS.CLIENTES,
            COLLECTIONS.VENTAS,
            COLLECTIONS.ABONOS,
            COLLECTIONS.TRANSACCIONES,
            COLLECTIONS.AUDITORIAS,
            COLLECTIONS.ELIMINACIONES,
            COLLECTIONS.CLIENTES_ELIMINADOS,
            COLLECTIONS.USUARIOS,
            COLLECTIONS.CONFIG
        ];

        try {
            actualizarUIEstadoNube('sincronizando', 'Preparando base de datos limpia...');

            for (const name of collectionsToClear) {
                while (true) {
                    const snap = await db.collection(name).limit(450).get();
                    if (snap.empty) break;
                    let batch = db.batch();
                    snap.docs.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                    if (snap.size < 450) break;
                }
            }

            const superAdmin = {
                id: 'SuperAdmin',
                cedula: 'SuperAdmin',
                nombre: 'SuperAdmin',
                telefono: '0412-0000000',
                email: 'superadmin@tubodeguita.com',
                password: '1a09807a0e6928a66d91025ed5fccd713c9edb101e72a1bbcb8a01cd9a53cb51',
                rol: 'admin',
                estado: 'ACTIVO',
                puntosAcumulados: 0,
                puntosCanjeados: 0,
                fechaRegistro: '2026-08-28 12:00'
            };

            await db.collection(COLLECTIONS.USUARIOS).doc('SuperAdmin').set(superAdmin, { merge: false });
            await db.collection(COLLECTIONS.CONFIG).doc('_system_reset_v4_3_7').set({
                completedAt: firebase.firestore.FieldValue.serverTimestamp(),
                description: 'Base inicial limpia: solo SuperAdmin.'
            });

            actualizarUIEstadoNube('conectado', 'Base de datos lista para comenzar');
            console.log('[Firebase] Reinicio inicial v4.3.7 completado: solo SuperAdmin.');
            return true;
        } catch (error) {
            console.error('[Firebase] Error durante reinicio inicial v4.3.7:', error);
            actualizarUIEstadoNube('error', 'No se pudo limpiar la base de datos');
            throw error;
        }
    }
'''
              text = text.replace(marker, insert + '\n' + marker, 1)

          call_anchor = '''            // Iniciar sincronización inicial desde la nube
            await sincronizarTodoDesdeNube();'''
          call_new = '''            // En el primer arranque de esta versión se deja Firestore en estado inicial limpio.
            // El marcador evita que el borrado vuelva a ejecutarse en futuros arranques.
            await ejecutarReinicioInicialV4_3_7();

            // Iniciar sincronización inicial desde la nube
            await sincronizarTodoDesdeNube();'''
          replace_once('core/firebase-service.js', call_anchor, call_new)

          Path('VERSION.txt').write_text('4.3.7-beta\n', encoding='utf-8')
          changelog = Path('CHANGELOG.md')
          current = changelog.read_text(encoding='utf-8') if changelog.exists() else '# Changelog\n'
          release = '''## 4.3.7-beta
- Restablecimiento inicial de Firestore para comenzar desde cero.
- Se eliminan productos, clientes, ventas, abonos, transacciones, auditorías, eliminaciones, clientes eliminados, usuarios y configuración existentes.
- Se recrea únicamente el usuario `SuperAdmin` activo.
- El reinicio es de una sola ejecución mediante marcador persistente en Firestore.
- El estado local inicial también contiene únicamente `SuperAdmin`.

'''
          if '## 4.3.7-beta' not in current:
              if current.startswith('# Changelog'):
                  current = '# Changelog\n\n' + release + current[len('# Changelog'):].lstrip('\n')
              else:
                  current = release + current
              changelog.write_text(current, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/app-state.js core/firebase-service.js VERSION.txt CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: reset database to clean SuperAdmin baseline (v4.3.7-beta)"
          git push

      - name: Remove bootstrap workflow
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main || true
          if [ -f .github/workflows/reset-database-v4.3.7.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            rm .github/workflows/reset-database-v4.3.7.yml
            git add .github/workflows/reset-database-v4.3.7.yml
            git commit -m "chore: remove database reset bootstrap workflow" || true
            git push || true
          fi
